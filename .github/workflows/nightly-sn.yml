name: Nightly Test run (Jahia Snapshot)

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 3 * * *'

jobs:
  integration-tests-sn:
    name: Integration Tests (Jahia SN ${{ matrix.jahia.line }})
    strategy:
      fail-fast: false
      matrix:
        # serverSettings 10.x ships in the 8.2.3.x pack from 8.2.3.8 on; 8-SNAPSHOT is the 8.2.4 line.
        jahia:
          - { line: "8.2.3", image: "ghcr.io/jahia/jahia-ee-dev:8.2.3-SNAPSHOT" }
          - { line: "8.2.4", image: "ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT" }
    secrets: inherit
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    with:
      module_id: serverSettings
      module_branch: main
      jahia_image: ${{ matrix.jahia.image }}
      provisioning_manifest: provisioning-manifest-snapshot.yml
      incident_service: serverSettings-JahiaSN-${{ matrix.jahia.line }}
      testrail_project: ServerSettings Module
      artifact_prefix: serset-sn-${{ matrix.jahia.line }}
      timeout_job: 45